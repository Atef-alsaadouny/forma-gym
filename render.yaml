services:
  - type: web
    name: forma-gym
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://formagym.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: forma-gym-db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: forma_gym
      - key: DB_USERNAME
        value: forma_gym
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: file
      - key: LOG_LEVEL
        value: warning
      - key: ASSET_URL
        value: /
    healthCheckPath: /up
    autoDeploy: true

  - type: pserv
    name: forma-gym-db
    runtime: image
    image:
      url: mysql:8.0
    envVars:
      - key: MYSQL_DATABASE
        value: forma_gym
      - key: MYSQL_USER
        value: forma_gym
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        sync: false
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
